name: GitHub-Profile-3D-Contrib

on:
  schedule:
    # Runs every day at midnight
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate profile-3d-contrib.svg
    steps:
      - uses: actions/checkout@v3
      - uses: yoshi3893/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.io"
          git add -A
          git commit -m "generated" || exit 0
          git push
